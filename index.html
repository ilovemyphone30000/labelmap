<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Major label map</title>
<style>
:root{--bg:#F1F2F4;--card:#FFF;--ink:#14171C;--muted:#697079;--rule:#DFE3E7;--soft:#EFF1F3;
 --umg:#181818;--sony:#E60000;--wmg:#00309C;--indie:#3D6B4A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
 font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
.top{padding:26px 28px 0;max-width:1600px;margin:0 auto}
h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0 0 16px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
#q{flex:1 1 240px;max-width:360px;padding:10px 13px;font:inherit;font-size:14.5px;
 border:1px solid var(--rule);border-radius:5px;background:#fff}
#q:focus{outline:2px solid var(--wmg);outline-offset:1px;border-color:transparent}
button{font:inherit;font-size:13px;padding:9px 13px;border:1px solid var(--rule);
 background:#fff;border-radius:5px;cursor:pointer;color:var(--ink)}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--wmg);outline-offset:1px}
button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.hits{font-size:13px;color:var(--muted)}
.lvl{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);
 white-space:nowrap}
#expand,#collapse{min-width:84px}
#lvltxt{display:inline-block;min-width:96px}
.lvldots{display:inline-flex;gap:3px}
.lvldots i{width:7px;height:7px;border-radius:50%;display:block;border:1px solid var(--rule);
 background:transparent;transition:background .12s,border-color .12s}
.lvldots i.on{background:var(--ink);border-color:var(--ink)}
button:disabled{opacity:.4;cursor:default}
button:disabled:hover{border-color:var(--rule)}
/* Bigger than the toolbar buttons, in a lighter box so it reads as its own thing. */
#quizBtn{margin-left:auto;font-size:14.5px;padding:11px 18px;border-radius:6px;
 border:1px solid #ECEEF0;background:#FBFCFC;color:var(--muted);
 transition:border-color .18s,color .18s,background .18s}
#quizBtn:hover{border-color:var(--rule);background:#fff;color:var(--ink)}
#quizBtn:focus-visible{outline:2px solid var(--wmg);outline-offset:1px}
.back{display:none;align-items:center;gap:6px;font-weight:600}
.back.on{display:inline-flex}

.cols{max-width:1600px;margin:0 auto;padding:0 28px 20px;display:grid;gap:20px;align-items:start;
 grid-template-columns:repeat(3,minmax(0,1fr))}
.cols.focus{grid-template-columns:minmax(0,1fr);max-width:1100px}
.col{background:var(--card);border-radius:9px;border-top:5px solid var(--c);overflow:hidden}
.crown{display:flex;align-items:center;gap:13px;padding:16px 18px;border-bottom:1px solid var(--rule);
 cursor:pointer;width:100%;border-radius:0;border-left:0;border-right:0;border-top:0;text-align:left}
.crown:hover{background:var(--soft)}
.logo{height:38px;max-width:132px;width:auto;object-fit:contain;flex:none}
.mono{height:38px;padding:0 12px;border-radius:6px;background:var(--c);color:#fff;flex:none;
 display:none;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.crown h2{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.crown .n{margin:0;font-size:12.5px;color:var(--muted)}
.body{padding:12px 16px 18px}

.tree ul{list-style:none;margin:0;padding:0}
.tree li{position:relative}
.tree li ul{margin-left:9px;padding-left:15px;border-left:1px solid var(--rule)}
.tree li ul>li::before{content:"";position:absolute;left:-15px;top:15px;width:11px;height:1px;background:var(--rule)}
.node{display:flex;align-items:center;gap:6px;padding:0 5px;border-radius:5px;cursor:pointer;
 border:0;background:none;font:inherit;text-align:left;width:100%;color:var(--ink)}
.node:hover{background:var(--soft)}
.node.b1{font-weight:600;font-size:14.5px}
.node.b2{font-size:13.5px}
.tw{width:30px;height:20px;flex:none;color:var(--ink);font-size:26px;line-height:20px;
 text-align:center;cursor:pointer;border-radius:4px}
.tw:hover{background:var(--rule);color:var(--ink)}
.node{min-height:0}
.tw.leaf{visibility:hidden}
.ct{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rnote{font-size:11.5px;color:var(--muted);font-weight:400;font-style:italic;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
mark{background:#FCEB9B;padding:0 1px;border-radius:2px}
.hide{display:none !important}

.gwrap .gsec{margin-bottom:13px}
.ghead{font-size:14px;font-weight:600;margin:0 0 6px;display:flex;gap:8px;align-items:baseline;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12.5px;padding:3px 8px;border-radius:12px;background:var(--soft);color:#2C333A;
 border:1px solid transparent;cursor:pointer}
.chip:hover{border-color:var(--c);color:var(--c)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);padding:7px 10px;border-bottom:1px solid var(--rule);font-size:12px}
td{padding:7px 10px;border-bottom:1px solid var(--soft)}
tr.tr:hover{background:var(--soft);cursor:pointer}
.tag{font-size:11px;padding:1px 6px;border-radius:3px;background:var(--soft);color:var(--muted)}
.tag.d{background:rgba(31,92,139,.10);color:var(--umg)}

.indies{max-width:1600px;margin:0 auto;padding:10px 28px 44px}
.indies h3{font-size:15px;font-weight:700;margin:20px 0 12px}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.ibox{background:var(--card);border-radius:8px;border-left:3px solid var(--indie);padding:8px 14px 12px}

.ov{position:fixed;inset:0;background:rgba(16,20,25,.5);display:none;align-items:center;
 justify-content:center;padding:20px;z-index:40}
.ov.on{display:flex}
.modal{background:#fff;border-radius:10px;max-width:440px;width:100%;padding:24px 26px 22px;
 box-shadow:0 14px 44px rgba(0,0,0,.24);position:relative}
.modal h4{margin:0 0 4px;font-size:19px;font-weight:700;letter-spacing:-.01em}
.chain{margin:0 0 18px;font-size:13px;color:var(--muted);line-height:1.55}
.mrow{display:flex;gap:14px;padding:9px 0;border-top:1px solid var(--soft);font-size:13.5px}
.mrow .k{color:var(--muted);flex:0 0 118px}
.mbio{margin:14px 0 0;font-size:13.5px;line-height:1.5;color:#2C333A}
.mdist{margin:14px 0 0;padding:11px 13px;border-radius:6px;background:rgba(0,48,156,.07);
 color:#0B2E7A;font-size:13px;line-height:1.5}
.go{display:inline-block;margin-top:16px;padding:9px 15px;border-radius:6px;background:var(--ink);
 color:#fff;text-decoration:none;font-size:13.5px;font-weight:500}
.x{position:absolute;top:12px;right:12px;border:0;background:none;font-size:19px;color:var(--muted);
 cursor:pointer;line-height:1;padding:5px 8px;border-radius:5px}
@media (max-width:1080px){.cols{grid-template-columns:1fr}}
/* ---------- quiz mode ---------- */
[hidden]{display:none!important}   /* display:flex below would otherwise beat it */
#quiz{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;
 padding:18px 20px 24px;gap:14px}
.qtop{display:flex;align-items:center;gap:14px;flex-wrap:wrap;max-width:1080px;margin:0 auto;width:100%}
.qstats{margin-left:auto;display:flex;gap:18px;align-items:center;font-size:12.5px;color:var(--muted)}
.qstats b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums;margin-left:4px}
.qlives{font-size:15px;letter-spacing:2px;color:var(--sony)}
.qmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
 max-width:1080px;margin:0 auto;width:100%}
.qprompt{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.qcard{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:28px 36px;
 font-size:27px;font-weight:700;letter-spacing:-.02em;text-align:center;max-width:660px;
 transition:border-color .15s,background .15s}
.qcard.ok{border-color:#2E7D4F;background:#EAF6EE}
.qcard.no{border-color:#C0392B;background:#FBEAE8}
.qfb{min-height:22px;font-size:14px;font-weight:600;text-align:center}
.qfb.ok{color:#2E7D4F}
.qfb.no{color:#C0392B}
.qcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:1080px;
 margin:0 auto;width:100%}
.qcol{background:var(--card);border:1px solid var(--rule);border-top:5px solid var(--c);
 border-radius:10px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;
 gap:10px;justify-content:center;min-height:108px;cursor:pointer}
.qcol:hover:not(:disabled){background:var(--soft)}
.qcol:disabled{opacity:.5;cursor:default}
.qcol img{height:30px;max-width:112px;object-fit:contain}
.qkey{font-size:11px;color:var(--muted)}
.qbig{font-size:56px;font-weight:700;line-height:1;letter-spacing:-.03em}
.qover h2{margin:0;font-size:28px;letter-spacing:-.02em}
.qrow{display:flex;gap:10px}
@media(max-width:640px){.qcols{grid-template-columns:1fr;gap:9px}.qcol{min-height:72px;padding:12px}
 .qcard{font-size:21px;padding:20px 22px}}
.qlevtag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
 color:var(--muted);border:1px solid var(--rule);border-radius:20px;padding:3px 10px;background:var(--card)}
.qlevels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:760px}
.qlev{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;
 padding:16px 16px 14px;border-radius:10px;min-height:96px}
.qlev b{font-size:17px}
.qlev span{font-size:13px;color:var(--muted);line-height:1.35;font-weight:400;font-style:italic}
.qlev i{margin-top:auto;font-style:normal;font-size:11px;color:var(--muted)}
.qhintwrap{display:flex;align-items:center;gap:10px;min-height:32px}
#qhint{font-size:12px;padding:6px 11px}
.qhinttext{font-size:13px;color:var(--muted)}
.qhinttext b{color:var(--ink)}
.qbio{font-size:13.5px;color:var(--muted);line-height:1.45;text-align:center;max-width:520px;
 min-height:38px;opacity:0;transition:opacity .2s}
.qbio.on{opacity:1}
#qnext{font-size:14px;padding:10px 22px;border-radius:6px}
@media(max-width:640px){.qlevels{grid-template-columns:1fr}.qlev{min-height:0}}

</style>
</head>
<body>

<div class="top">
  <h1>MAJORS</h1>
  <div class="bar">
    <button class="back" id="back">← All three</button>
    <input id="q" type="search" placeholder="Search any label" autocomplete="off" aria-label="Search labels">
    <button id="expand">Expand</button>
    <button id="collapse">Collapse</button>
    <span class="lvl" id="lvl"><span class="lvldots" id="lvldots"></span><span id="lvltxt"></span></span>
    <span class="hits" id="hits"></span>
    <button id="quizBtn">Quiz mode</button>
  </div>
</div>

<div class="cols" id="cols"></div>
<div class="indies" id="indies"></div>

<div class="ov" id="ov"><div class="modal" role="dialog" aria-modal="true">
  <button class="x" id="x" aria-label="Close">&times;</button><div id="mbody"></div>
</div></div>

<div id="quiz" hidden>
  <div class="qtop">
    <button id="qx">&larr; Exit quiz</button>
    <span class="qlevtag" id="qlevtag" hidden></span>
    <div class="qstats" id="qstats" hidden>
      <span>Score<b id="qsc">0</b></span>
      <span>Streak<b id="qst">0</b></span>
      <span>Best<b id="qbs">0</b></span>
      <span class="qlives" id="qlv"></span>
    </div>
  </div>
  <div class="qmid qover" id="qmenu">
    <div class="qprompt">Quiz mode</div>
    <h2>Which major owns it?</h2>
    <div class="qlevels">
      <button class="qlev" data-l="easy"><b>Easy</b><span>ROSTR Rookie</span><i id="qbe"></i></button>
      <button class="qlev" data-l="medium"><b>Medium</b><span>A&amp;R Apprentice</span><i id="qbm"></i></button>
      <button class="qlev" data-l="hard"><b>Hard</b><span>Merger Monarch</span><i id="qbh"></i></button>
    </div>
  </div>
  <div class="qmid" id="qplay" hidden>
    <div class="qprompt">Which major owns it?</div>
    <div class="qcard" id="qcard"><span id="qname"></span></div>
    <div class="qhintwrap">
      <button id="qhint" hidden>Hint &mdash; show the label above it</button>
      <span class="qhinttext" id="qhinttext"></span>
    </div>
    <div class="qfb" id="qfb"></div>
    <div class="qbio" id="qbio"></div>
    <button id="qnext" hidden>Next</button>
  </div>
  <div class="qmid qover" id="qend" hidden>
    <div class="qprompt">Final score</div>
    <div class="qbig" id="qfin">0</div>
    <h2 id="qverdict"></h2>
    <div class="qprompt" id="qsum"></div>
    <div class="qrow">
      <button id="qagain">Play again</button>
      <button id="qmenubtn">Change difficulty</button>
      <button id="qexit2">Back to the map</button>
    </div>
  </div>
  <div class="qcols" id="qcols" hidden>
    <button class="qcol" data-k="umg" style="--c:var(--umg)"><img id="qlu" alt="Universal Music Group"><span class="qkey">press 1</span></button>
    <button class="qcol" data-k="sony" style="--c:var(--sony)"><img id="qls" alt="Sony Music Group"><span class="qkey">press 2</span></button>
    <button class="qcol" data-k="wmg" style="--c:var(--wmg)"><img id="qlw" alt="Warner Music Group"><span class="qkey">press 3</span></button>
  </div>
</div>

const SLUGFIX={"(dis)harmony":"disharmony0","Parametric":"parametric0","'94 Sounds":"94sounds0"};
const slug=s=>SLUGFIX[s]||s.toLowerCase().replace(/[^a-z0-9]/g,'');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const META=new Map(), ROWS=[];
const count=n=>(n.c||[]).reduce((a,k)=>a+1+count(k),0);

function index(list,owner,root,ck,terr){
  for(const nd of list){
    const isAff=!!nd.aff;
    if(!nd.lbl){
      META.set(nd.n,{owner:isAff?null:owner,root,ck,aff:isAff?AFFIL[nd.n]:null,rel:nd.rel,terr});
      ROWS.push({n:nd.n,owner:isAff?'Independent':owner,root,ck,aff:isAff?AFFIL[nd.n]:null,terr:terr||!!nd.terr});
    }
    if(nd.c) index(nd.c, nd.lbl?owner:nd.n, root, ck, terr||!!nd.terr);
  }
}
for(const k of ['umg','sony','wmg']){
  META.set(T[k].name,{owner:null,root:T[k].name,ck:k,aff:null,terr:false});
  index(T[k].b,T[k].name,T[k].name,k,false);
}
for(const g of INDIE){
  META.set(g.n,{owner:null,root:g.n,ck:'indie',aff:null,terr:false});
  ROWS.push({n:g.n,owner:'Top level',root:g.n,ck:'indie',aff:null,terr:false});
  g.c.forEach(c=>{META.set(c,{owner:g.n,root:g.n,ck:'indie',aff:null,terr:false});
    ROWS.push({n:c,owner:g.n,root:g.n,ck:'indie',aff:null,terr:false});});
}

let focus=null;
// How many layers of the tree are open. Expand/Collapse step this by one.
let xLevel=1, xMax=1;

// Relationship shown inline on the row. Not ownership - see the popup for the full note.
const relNote=(n,rel)=>{const a=AFFIL[n]; if(!a) return '';
  return rel==='JV'?'JV with '+a : rel==='49%'?'49% '+a : 'via '+a;};

function treeHTML(list,depth){
  let h='<ul>';
  for(const nd of list){
    const kids=nd.c||[];
    h+=`<li data-n="${esc(nd.n)}" data-terr="${nd.terr?1:0}">
      <button class="node ${depth===0?'b1':'b2'}" data-open="${nd.lbl||nd.terr?'':esc(nd.n)}">
        <span class="tw${kids.length?'':' leaf'}">${kids.length?((nd.terr?depth+1:depth)>=xLevel?'▸':'▾'):''}</span>
        <span class="lab">${esc(nd.n)}</span>
        ${nd.aff?'<span class="rnote" title="'+esc(relNote(nd.n,nd.rel))+'">'+esc(relNote(nd.n,nd.rel))+'</span>':''}
        ${kids.length?`<span class="ct">${count(nd)}</span>`:''}
      </button>`;
    if(kids.length){
      const ed=nd.terr?depth+1:depth;
      h+=`<div class="sub${ed>=xLevel?' hide':''}" data-d="${ed}">${treeHTML(kids,depth+1)}</div>`;
    }
    h+='</li>';
  }
  return h+'</ul>';
}
function draw(){
  const cols=document.getElementById('cols');
  cols.className='cols'+(focus?' focus':'');
  const keys=focus?[focus]:['umg','sony','wmg'];
  cols.innerHTML=keys.map(k=>{
    const m=T[k], total=m.b.reduce((a,b)=>a+1+count(b),0);
    const inner=`<div class="tree">${treeHTML(m.b,0)}</div>`;
    return `<div class="col" style="--c:var(--${k})">
      <button class="crown" data-major="${k}">
        <img class="logo" src="${LOGO[k]}" alt="" referrerpolicy="no-referrer"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <span class="mono">${k.toUpperCase()}</span>
        <span><h2>${esc(m.name)}</h2><p class="n">${total} companies${focus?'':' — click to focus'}</p></span>
      </button><div class="body">${inner}</div></div>`;
  }).join('');
  const ind=document.getElementById('indies');
  ind.classList.toggle('hide',!!focus);
  if(!focus && !ind.dataset.done){
    ind.dataset.done='1';
    ind.innerHTML='<h3>INDIES</h3><div class="igrid">'+INDIE.map(g=>
      `<div class="ibox" data-n="${esc(g.n)}"><div class="tree"><ul><li data-n="${esc(g.n)}" data-terr="0">
       <button class="node b1" data-open="${esc(g.n)}"><span class="tw${g.c.length?'':' leaf'}">${g.c.length?'▾':''}</span><span class="lab">${esc(g.n)}</span>${g.c.length?`<span class="ct">${g.c.length}</span>`:''}</button>
       ${g.c.length?`<div class="sub" data-d="0"><ul>${g.c.map(c=>`<li data-n="${esc(c)}" data-terr="0"><button class="node b2" data-open="${esc(c)}"><span class="tw leaf"></span><span class="lab">${esc(c)}</span></button></li>`).join('')}</ul></div>`:''}
      </li></ul></div></div>`).join('')+'</div>';
  }
  document.getElementById('back').classList.toggle('on',!!focus);
  const ds=[...document.querySelectorAll('.sub')].map(x=>+(x.dataset.d||0));
  xMax=ds.length?Math.max(...ds)+1:1;
  syncLevelBtns();
  apply();
}

document.addEventListener('click',e=>{
  const tw=e.target.closest('.tw');
  if(tw && !tw.classList.contains('leaf')){
    const sub=tw.closest('li').querySelector(':scope > .sub');
    if(sub){ const h=sub.classList.toggle('hide'); tw.textContent=h?'▸':'▾'; e.stopPropagation(); return; }
  }
  const crown=e.target.closest('.crown');
  if(crown){ focus=focus?null:crown.dataset.major; window.scrollTo(0,0); draw(); return; }
  const o=e.target.closest('[data-open]');
  if(o && o.dataset.open){ openModal(o.dataset.open); return; }
});
document.getElementById('back').onclick=()=>{focus=null;draw();};

const ov=document.getElementById('ov'), mbody=document.getElementById('mbody');
function openModal(n){
  const m=META.get(n)||{owner:null,root:'—',aff:null};
  const chain=[]; let c=n,g=0;
  while(c&&g++<10){chain.unshift(c); c=(META.get(c)||{}).owner;}
  mbody.innerHTML=`<h4>${esc(n)}</h4><p class="chain">${chain.map(esc).join(' › ')}</p>
   <div class="mrow"><span class="k">Relationship</span><span>${m.aff?(m.rel==='JV'?'Joint venture with '+esc(m.aff):m.rel==='49%'?esc(m.aff)+' holds a 49% ownership stake':'Distributed by '+esc(m.aff)+', independently owned'):'Owned'}</span></div>
   <div class="mrow"><span class="k">Owner</span><span>${m.owner?esc(m.owner):(m.aff?'Independent':'Top level')}</span></div>
   <div class="mrow"><span class="k">Sits under</span><span>${esc(m.root)}</span></div>
   ${BIO[n]?`<p class="mbio">${esc(BIO[n])}</p>`:''}
   ${DIST[n]?`<p class="mdist">${esc(DIST[n])}</p>`:''}
   ${NOPAGE.has(n)?'<p class="chain" style="margin-top:16px">Not listed in ROSTR</p>':
     `<a class="go" href="https://www.rostr.cc/company/${slug(n)}" target="_blank" rel="noopener">Open in ROSTR</a>`}`;
  ov.classList.add('on'); document.getElementById('x').focus();
}
document.getElementById('x').onclick=()=>ov.classList.remove('on');
ov.onclick=e=>{if(e.target===ov)ov.classList.remove('on')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')ov.classList.remove('on')});

const q=document.getElementById('q'), hits=document.getElementById('hits');
function apply(){
  const t=q.value.trim().toLowerCase(); let shown=0;
  document.querySelectorAll('li[data-n]').forEach(el=>{
    const n=el.dataset.n; if(!n) return;
    let ok=!t||n.toLowerCase().includes(t);
    el.dataset.hit=ok?1:0;
    const lab=el.querySelector?el.querySelector('.lab'):null;
    if(lab) lab.innerHTML=(t&&ok)?esc(n).replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>'):esc(n);
    if(ok) shown++;
  });
  document.querySelectorAll('li[data-n]').forEach(li=>{
    const self=li.dataset.hit==='1', inside=li.querySelector('li[data-hit="1"]')!==null;
    li.classList.toggle('hide',!(self||inside));
    const sub=li.querySelector(':scope > .sub'), tw=li.querySelector('.tw');
    if(sub&&t){sub.classList.toggle('hide',!inside); if(tw&&!tw.classList.contains('leaf'))tw.textContent=inside?'▾':'▸';}
  });
  document.querySelectorAll('.ibox').forEach(b=>b.classList.toggle('hide',b.querySelector('li[data-hit="1"]')===null));
  hits.textContent=t?shown+' matching':'';
  if(!t) setLevel(xLevel);        // search left the subs however it liked; restore the layer
}
q.oninput=apply;
function syncLevelBtns(){
  const e=document.getElementById('expand'), c=document.getElementById('collapse');
  e.disabled = xLevel>=xMax; c.disabled = xLevel<=0;
  // Labels stay fixed: changing them resizes the buttons and the row shifts under
  // the cursor mid-click. The readout carries the state instead.
  e.title='Show one more layer'; c.title='Hide a layer';
  let dots='';
  for(let i=1;i<=xMax;i++) dots+='<i class="'+(i<=xLevel?'on':'')+'"></i>';
  document.getElementById('lvldots').innerHTML=dots;
  document.getElementById('lvltxt').textContent =
    xLevel===0 ? 'all collapsed'
    : xLevel>=xMax ? 'all '+xMax+' layers open'
    : xLevel+' of '+xMax+' layers';
}
function setLevel(l){
  xLevel=Math.max(0,Math.min(xMax,l));
  document.querySelectorAll('.sub').forEach(sub=>{
    sub.classList.toggle('hide', (+(sub.dataset.d||0))>=xLevel);
  });
  document.querySelectorAll('.tw:not(.leaf)').forEach(tw=>{
    const sub=tw.closest('li').querySelector(':scope > .sub');
    if(sub) tw.textContent=sub.classList.contains('hide')?'▸':'▾';
  });
  syncLevelBtns();
}
document.getElementById('expand').onclick=()=>setLevel(xLevel+1);
document.getElementById('collapse').onclick=()=>setLevel(xLevel-1);
draw();

/* quiz mode - game logic */
// Difficulty is "how big and how deep": depth 0 (a major's own divisions) and the
// frontline labels that own imprints of their own are easy; one level in is medium;
// two levels down is hard. `aff` branches are skipped entirely - those companies are
// distributed by a major, not owned by one, so the question has no right answer.
const QPOOL=[];
(function(){
  const STOP=new Set(['records','record','music','group','entertainment','the','and',
    'of','inc','ltd','llc','co','recordings','label','labels','musik']);
  const toks=n=>(n.toLowerCase().match(/[a-z']+/g)||[]).filter(w=>w.length>2&&!STOP.has(w));
  const size=nd=>(nd.c||[]).reduce((a,c)=>a+1+size(c),0);

  ['umg','sony','wmg'].forEach(k=>{
    // Pass 1: every word used by a NON-territory company in this major, plus the
    // major's own name. A territory arm sharing one of these words announces its
    // parent ("Columbia Records Italy"), so it stays easy.
    const MAJ=new Set(toks(T[k].name));   // 'universal' / 'sony' / 'warner'
    const home=new Set(MAJ);
    const collect=(nd,isT)=>{
      if(nd.aff)return;
      const t=isT||!!nd.terr;
      if(!nd.lbl&&!t)toks(nd.n).forEach(w=>home.add(w));
      (nd.c||[]).forEach(c=>collect(c,t));
    };
    T[k].b.forEach(b=>collect(b,false));

    // Pass 2: build the pool. A territory arm whose name gives nothing away is a
    // deep cut and goes to hard, whatever its depth.
    const walk=(nd,depth,parent,isT)=>{
      if(nd.aff)return;
      const t=isT||!!nd.terr;
      if(nd.lbl){(nd.c||[]).forEach(c=>walk(c,depth,parent,t));return;}
      // A name carrying the major's own name answers the question for you
      // ("Universal Music Germany"), so it is left out of the quiz entirely.
      if(!toks(nd.n).some(w=>MAJ.has(w))){
        let lev=(depth===0||(depth===1&&size(nd)>=1))?'easy':(depth===1?'medium':'hard');
        if(t&&!toks(nd.n).some(w=>home.has(w)))lev='hard';
        // Withhold the hint when naming the parent would name the major
        // ("Warner Records", "Universal Music Group Nashville").
        const hint=(depth>=1&&parent&&!toks(parent).some(w=>MAJ.has(w)))?parent:null;
        QPOOL.push({n:nd.n,k:k,lev:lev,p:hint});
      }
      (nd.c||[]).forEach(c=>walk(c,depth+1,nd.n,t));
    };
    T[k].b.forEach(b=>walk(b,0,null,false));
  });
})();

const QK=['umg','sony','wmg'], qEl=document.getElementById('quiz');
const QLEV={easy:'Easy',medium:'Medium',hard:'Hard'};
let qScore=0,qStreak=0,qBestStreak=0,qLives=3,qCur=null,qBusy=false,qPrev=null,
    qLevel='easy',qSet=[],qHinted=false,qHintCount=0;

const qBestKey=l=>'lm_quiz_best_'+l;
function qGetBest(l){try{return parseFloat(localStorage.getItem(qBestKey(l))||'0')||0;}catch(e){return 0;}}
const qFmt=v=>Number.isInteger(v)?String(v):v.toFixed(1);   // 3 stays 3, 3.5 shows as 3.5
function qPutBest(l,v){try{localStorage.setItem(qBestKey(l),String(v));}catch(e){}}

const qS=(id,v)=>{document.getElementById(id).textContent=v;};
const qShow=(id,on)=>{document.getElementById(id).hidden=!on;};
const qHearts=()=>{qS('qlv','♥'.repeat(qLives)+'♡'.repeat(3-qLives));};

function qOpen(){
  qEl.hidden=false;document.body.style.overflow='hidden';
  qShow('qmenu',true);qShow('qplay',false);qShow('qend',false);
  qShow('qcols',false);qShow('qstats',false);qShow('qlevtag',false);
  const n=l=>QPOOL.filter(x=>x.lev===l).length;
  qS('qbe','Best '+qFmt(qGetBest('easy'))+' · '+n('easy')+' companies');
  qS('qbm','Best '+qFmt(qGetBest('medium'))+' · '+n('medium')+' companies');
  qS('qbh','Best '+qFmt(qGetBest('hard'))+' · '+n('hard')+' companies');
}
function qExit(){qEl.hidden=true;document.body.style.overflow='';}

function qStart(level){
  qLevel=level||qLevel;
  qSet=QPOOL.filter(x=>x.lev===qLevel);
  qScore=0;qStreak=0;qBestStreak=0;qLives=3;qBusy=false;qPrev=null;qHintCount=0;
  qShow('qmenu',false);qShow('qend',false);qShow('qplay',true);
  qShow('qcols',true);qShow('qstats',true);qShow('qlevtag',true);
  qS('qlevtag',QLEV[qLevel]);
  qS('qsc',0);qS('qst',0);qS('qbs',qFmt(qGetBest(qLevel)));qHearts();
  qNext();
}

function qNext(){
  let p;
  do{p=qSet[Math.floor(Math.random()*qSet.length)];}while(qSet.length>1&&p.n===qPrev);
  qPrev=p.n;qCur=p;qHinted=false;
  document.getElementById('qcard').className='qcard';
  qS('qname',p.n);
  qS('qfb','');document.getElementById('qfb').className='qfb';
  qS('qbio','');document.getElementById('qbio').className='qbio';
  qS('qhinttext','');
  document.getElementById('qnext').hidden=true;
  qShow('qhint',!!p.p);
  document.getElementById('qhint').disabled=false;
  document.querySelectorAll('.qcol').forEach(b=>{b.disabled=false;});
  qBusy=false;
}

function qUseHint(){
  if(qBusy||!qCur||!qCur.p||qHinted)return;
  qHinted=true;qHintCount++;
  qShow('qhint',false);
  document.getElementById('qhinttext').innerHTML=
    'Sits under <b>'+esc(qCur.p)+'</b> — half a point for this one';
}

function qAnswer(k){
  if(qBusy||!qCur||qEl.hidden)return;
  qBusy=true;
  document.querySelectorAll('.qcol').forEach(b=>{b.disabled=true;});
  document.getElementById('qhint').disabled=true;
  const card=document.getElementById('qcard'),fb=document.getElementById('qfb'),
        right=qCur.k===k;
  if(right){
    qScore += qHinted ? 0.5 : 1;
    qStreak++;if(qStreak>qBestStreak)qBestStreak=qStreak;
    card.classList.add('ok');fb.className='qfb ok';
    fb.textContent=qHinted?('Correct — '+T[qCur.k].name+' (half point, hint used)')
                          :('Correct — '+T[qCur.k].name);
  }else{
    qLives--;qStreak=0;
    card.classList.add('no');fb.className='qfb no';
    fb.textContent=qCur.n+' is '+T[qCur.k].name;
  }
  qS('qsc',qFmt(qScore));qS('qst',qStreak);qHearts();
  const bio=BIO[qCur.n];
  if(bio){ qS('qbio',bio); document.getElementById('qbio').className='qbio on'; }
  // No timer: the hint, the answer and the bio stay up until you move on yourself.
  const nx=document.getElementById('qnext');
  nx.textContent = qLives<=0 ? 'See results' : 'Next';
  nx.hidden=false; nx.focus();
}

function qAdvance(){
  if(!qBusy) return;                     // also stops Enter double-firing off the button
  document.getElementById('qnext').hidden=true;
  if(qLives<=0){qEnd();}else{qNext();}
}

function qEnd(){
  const best=qGetBest(qLevel), beat=qScore>best;
  if(beat)qPutBest(qLevel,qScore);
  qS('qbs',qFmt(beat?qScore:best));
  qShow('qplay',false);qShow('qcols',false);qShow('qend',true);
  qS('qfin',qFmt(qScore));
  qS('qverdict',beat?'New high score':(qScore>=20?'Strong run':qScore>=10?'Not bad':'Room to improve'));
  qS('qsum',QLEV[qLevel]+' · best streak '+qBestStreak+' · high score '+qFmt(beat?qScore:best)
            +(qHintCount?' · '+qHintCount+' hint'+(qHintCount>1?'s':'')+' used':''));
}

document.getElementById('qlu').src=LOGO.umg;
document.getElementById('qls').src=LOGO.sony;
document.getElementById('qlw').src=LOGO.wmg;
document.getElementById('quizBtn').onclick=qOpen;
document.getElementById('qx').onclick=qExit;
document.getElementById('qagain').onclick=()=>qStart();
document.getElementById('qmenubtn').onclick=qOpen;
document.getElementById('qexit2').onclick=qExit;
document.getElementById('qhint').onclick=qUseHint;
document.getElementById('qnext').onclick=qAdvance;
document.querySelectorAll('.qlev').forEach(b=>{b.onclick=()=>qStart(b.dataset.l);});
document.querySelectorAll('.qcol').forEach(b=>{b.onclick=()=>qAnswer(b.dataset.k);});
document.addEventListener('keydown',e=>{
  if(qEl.hidden)return;
  if(e.key==='Escape'){qExit();return;}
  if(!document.getElementById('qend').hidden){if(e.key==='Enter')qStart();return;}
  if(document.getElementById('qplay').hidden)return;
  if(qBusy){                              // answered - waiting on Next
    if(e.key==='Enter'||e.key===' '||e.key==='n'||e.key==='N'){e.preventDefault();qAdvance();}
    return;
  }
  if(e.key==='h'||e.key==='H'){qUseHint();return;}
  const n=['1','2','3'].indexOf(e.key);
  if(n>=0)qAnswer(QK[n]);
});
</script>
